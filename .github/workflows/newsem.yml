name: news CI/CD

on:
  workflow_dispatch:
    branches: [main]

jobs:
  lint:
    name: "Линт. НУЖНО ДОПОЛНИТЬ"
    runs-on: ubuntu-latest
    steps:
      # Шаг 1:
      - name: flake8,pylint,black,mypy
        run: echo "смотрим линт ОБЯЗАТЕЛЬНО ИСПРАВИТЬ"
  test:
    name: "Скачаем зависимости и Запуск тестов.НУЖНО ДОБАВИТЬ БОЛЬШЕ ТЕСТОВ FASTAPI"
    runs-on: ubuntu-latest
    needs: lint
    steps:
      # Шаг 1: Скачивание кода моего репозитория
      - name: Скачивание кода моего
        uses: actions/checkout@v4
      # Шаг 2: Установка версии Python
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Установим зависимости (requirements.txt)
        run: |
           python -m pip install --upgrade pip
           pip install -r requirements.txt
      - name: смотрим что в папках
        run: |
          pwd
          ls -la
          cd tests
          ls -la
      - name: начало tests
        run: pytest tests/tests_sev.py -v
        # pytest tests/ -v --html=results/report.html --self-contained-html
        env:
            PYTHONPATH: ${{ github.workspace }}  # 👈 Добавляем корень репозитория в путь
#      # 👇 СОХРАНЯЕМ РЕЗУЛЬТАТ   артефакты
#      - name: 📦 Upload test report
#        uses: actions/upload-artifact@v4
#        if: always()  # 👈 Загрузить даже если тесты упали!
#        with:
#          name: pytest-report
#          path: results/
  build:
    name: "Создаем docker image"
    needs: [test,lint]
    runs-on: ubuntu-latest

    steps:
      # Шаг 1: Скачивание кода репозитория
      - name: Checkout кода
        uses: actions/checkout@v4
      # Шаг 2: Авторизация в Docker Hub
      - name: Login в Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN_GIT }}
      # Шаг 3: Сборка и отправка образа (Build & Push)
      - name: Build и Push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            sem87sem/new:latest
            sem87sem/new:1.1
            sem87sem/new:${{ github.sha }}
